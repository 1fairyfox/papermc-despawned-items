name: Docs

# Builds the Dokka API docs and publishes them to GitHub Pages on every release to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level (Scorecard Token-Permissions); the deploy job below
# elevates only the pages/id-token scopes it needs.
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The screenshot capture job is parked (see screenshots.yml). /screenshots.html degrades
  # honestly to "no frames published yet" when no artifact is present, so the docs publish
  # unchanged and the gallery lights up as soon as images are produced again — by the
  # separate MCP driver, or by a manual capture run.
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build the docs site (chrome pages + boundaried Dokka under /api/)
        run: ./gradlew assembleDocsSite --no-daemon --stacktrace
      # Weave the freshly captured frames into the site so README/docs image URLs
      # (…/screenshots/<name>.png) always resolve to the current build's screenshots —
      # the "README references up-to-date images automatically" requirement.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: release-screenshots
          path: build/docs-site/screenshots
      - name: Report the published gallery
        run: |
          if [ -f build/docs-site/screenshots/manifest.json ]; then
            echo "Publishing $(jq '.scenes | length' build/docs-site/screenshots/manifest.json) screenshot(s)."
          else
            echo "No screenshots artifact — the gallery page will say so rather than showing stale art."
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs-site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
